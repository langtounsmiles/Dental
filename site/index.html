<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirkcaldy Dental &amp; Implant Clinic – New NHS Dental Practice Opening in Kirkcaldy</title>
<meta name="description" content="Kirkcaldy Dental & Implant Clinic is a new NHS dental practice opening soon in Kirkcaldy, Fife.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --gold: #c3a363; --gold-dark: #9a7a3f; --soft: #f6efe3; --ink: #2f2f2f; --muted: #6b6b6b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Lato", system-ui, sans-serif; color: var(--ink); line-height: 1.6;
         background: linear-gradient(180deg, var(--soft), #fff 70%); display: flex; flex-direction: column; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 56px 20px; }
  .inner { max-width: 720px; }
  img.logo { width: min(340px, 72vw); height: auto; margin-bottom: 32px; }
  .badge { display: inline-block; border: 1px solid var(--gold); color: var(--gold-dark); border-radius: 999px; padding: 6px 16px;
           font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 20px; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; line-height: 1.12; margin: 0 0 18px; font-size: clamp(2.3rem, 6.5vw, 3.8rem); }
  h1 span { color: var(--gold); }
  p.lead { font-size: 1.2rem; color: var(--muted); margin: 0 auto; max-width: 560px; }
  a.cta { display: inline-block; margin-top: 28px; padding: 14px 30px; border-radius: 10px; color: #fff; font-weight: 700; text-decoration: none;
          background: linear-gradient(180deg, #cdb074, var(--gold-dark)); }
  footer { text-align: center; padding: 20px; font-size: .85rem; color: var(--muted); }
  footer a { color: var(--gold-dark); }
</style>
</head>
<body>
<main>
  <div class="inner">
    <img class="logo" src="assets/logo-stacked.svg" alt="Kirkcaldy Dental &amp; Implant Clinic">
    <div><span class="badge">Coming soon</span></div>
    <h1>New NHS Dental Practice<br><span>Opening in Kirkcaldy</span></h1>
    <p class="lead">Be the first to hear when we open. Register your interest for opening news.</p>
    <a class="cta" href="register/">Register Interest</a>
  </div>
</main>
<footer>
  © 2026 Kirkcaldy Dental &amp; Implant Clinic · <a href="mailto:info@kirkcaldydentist.co.uk">info@kirkcaldydentist.co.uk</a> · <a href="privacy.html">Privacy, complaints &amp; regulation</a>
</footer>
</body>
</html>
